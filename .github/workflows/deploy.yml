name: Deploy Hexo to Tencent Cloud COS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npx hexo clean
          npx hexo generate

      # 同步到腾讯云 COS（使用 Python SDK，比 coscli 更稳定）
      - name: Deploy to Tencent Cloud COS
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          pip install cos-python-sdk-v5 -q
          python3 << 'PYEOF'
          import os, glob, mimetypes
          from qcloud_cos import CosConfig, CosS3Client

          secret_id = os.environ['COS_SECRET_ID']
          secret_key = os.environ['COS_SECRET_KEY']
          region = os.environ['COS_REGION']
          bucket = os.environ['COS_BUCKET']

          config = CosConfig(Region=region, SecretId=secret_id, SecretKey=secret_key)
          client = CosS3Client(config)

          # 清空桶内旧文件
          while True:
              resp = client.list_objects(Bucket=bucket, MaxKeys=1000)
              objs = resp.get('Contents', [])
              if not objs:
                  break
              delete_keys = [{'Key': o['Key']} for o in objs]
              client.delete_objects(Bucket=bucket, Delete={'Object': delete_keys})
              if not resp.get('IsTruncated'):
                  break

          # 上传 public/ 目录
          for root, dirs, files in os.walk('./public'):
              for file in files:
                  local_path = os.path.join(root, file)
                  cos_key = os.path.relpath(local_path, './public')
                  content_type, _ = mimetypes.guess_type(local_path)
                  extra = {'ContentType': content_type or 'application/octet-stream'}
                  with open(local_path, 'rb') as f:
                      client.put_object(Bucket=bucket, Body=f, Key=cos_key, **extra)
                  print(f"Uploaded: {cos_key}")
          PYEOF
