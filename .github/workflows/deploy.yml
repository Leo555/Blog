name: Deploy Hexo to Tencent Cloud COS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npx hexo clean
          npx hexo generate

      # 同步到腾讯云 COS
      # zkonge/coscli-action 会用 SecretId/SecretKey 直接调用 COS API
      # --delete 会删除桶内本次构建产物中没有的旧文件，保持桶内容与 public/ 完全一致
      - name: Deploy to Tencent Cloud COS
        uses: zkonge/coscli-action@v1
        with:
          secret_id: ${{ secrets.TENCENT_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}        # 例如 blog-1234567890
          cos_region: ${{ secrets.COS_REGION }}        # 例如 ap-guangzhou
          local_path: ./public
          remote_path: /
          remove_files: true                            # 同步时删除桶内多余文件
