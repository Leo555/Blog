name: Deploy Hexo to Tencent Cloud COS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npx hexo clean
          npx hexo generate

      # 同步到腾讯云 COS（使用 coscmd，多线程并发上传，速度快）
      - name: Deploy to Tencent Cloud COS
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          pip install coscmd -q
          cat > ~/.coscos.conf <<EOF
          [common]
          secret_id = ${COS_SECRET_ID}
          secret_key = ${COS_SECRET_KEY}
          bucket = ${COS_BUCKET}
          region = ${COS_REGION}
          schema = https
          EOF
          coscmd -r ${COS_REGION} -b ${COS_BUCKET} delete -r -f / 2>/dev/null || true
          coscmd -r ${COS_REGION} -b ${COS_BUCKET} upload -r ./public/ /
