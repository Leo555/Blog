name: Deploy Hexo to Tencent Cloud COS

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npx hexo clean
          npx hexo generate

      # 同步到腾讯云 COS
      # 使用腾讯云官方 coscli 命令行工具直接上传
      - name: Install coscli
        run: |
          wget -q https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -O coscli
          chmod +x coscli
          sudo mv coscli /usr/local/bin/coscli

      - name: Deploy to Tencent Cloud COS
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          cat > ~/.cos.yaml <<EOF
          cos:
            base:
              secretid: ${COS_SECRET_ID}
              secretkey: ${COS_SECRET_KEY}
              sessiontoken: ""
            buckets:
              - name: ${COS_BUCKET}
                alias: default
                region: ${COS_REGION}
                endpoint: cos.${COS_REGION}.myqcloud.com
          EOF
          coscli rm -r cos://default/ || true
          coscli cp -r ./public/ cos://default/
